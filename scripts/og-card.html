<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <title>OG card template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from assets/style.css :root (dark, neutral since 2026-10-29). Copied rather than
       linked because the card renders from file:// where the site's relative
       asset paths don't resolve — and because a share card should be frozen
       anyway: it's cached by every platform that scrapes it, so it must not
       silently change when the site's CSS does. Keep in sync by hand if the
       palette moves; there is a matching note in CLAUDE.md. */
    :root {
      --bg-primary:    #0a0a0a;
      --bg-secondary:  #141414;
      --text-primary:  #ececec;
      --text-secondary:#b3b3b3;
      --text-tertiary: #8f8f8f;
      --border-medium: rgba(255, 255, 255, 0.18);
      --accent:        #eb5a00;
      --accent-cool:   #7aa9a3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
    }

    /* Studio's worn graph paper, at card scale. */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 96px 96px, 96px 96px;
      opacity: 1;
    }

    /* The starburst from the studio hero, bleeding off the right edge. */
    .rays {
      position: absolute;
      right: -180px;
      top: 50%;
      transform: translateY(-50%);
      width: 620px;
      height: 620px;
      opacity: 0.32;
    }

    .body { position: relative; z-index: 1; display: flex; align-items: center; gap: 40px; }

    .icon {
      width: 132px;
      height: 132px;
      border-radius: 28px;
      flex-shrink: 0;
      outline: 1px solid oklch(1 0 0 / 0.1);
      outline-offset: -1px;
      object-fit: cover;
    }

    h1 {
      font-size: 78px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      max-width: 1000px;
      text-wrap: balance;
    }

    h1.long { font-size: 62px; }

    .sub {
      margin-top: 20px;
      font-size: 26px;
      line-height: 1.35;
      color: var(--text-secondary);
      max-width: 30ch;
      text-wrap: pretty;
    }

    .foot {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 22px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .foot .url { color: var(--accent-cool); }
  </style>
</head>
<body>
  <svg class="rays" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <g stroke="#eb5a00" stroke-width="0.6" opacity="0.7">
      <line x1="100" y1="100" x2="100" y2="0"/><line x1="100" y1="100" x2="170" y2="30"/>
      <line x1="100" y1="100" x2="200" y2="100"/><line x1="100" y1="100" x2="170" y2="170"/>
      <line x1="100" y1="100" x2="100" y2="200"/><line x1="100" y1="100" x2="30" y2="170"/>
      <line x1="100" y1="100" x2="0" y2="100"/><line x1="100" y1="100" x2="30" y2="30"/>
      <line x1="100" y1="100" x2="140" y2="10"/><line x1="100" y1="100" x2="190" y2="60"/>
      <line x1="100" y1="100" x2="190" y2="140"/><line x1="100" y1="100" x2="140" y2="190"/>
      <line x1="100" y1="100" x2="60" y2="190"/><line x1="100" y1="100" x2="10" y2="140"/>
      <line x1="100" y1="100" x2="10" y2="60"/><line x1="100" y1="100" x2="60" y2="10"/>
    </g>
  </svg>

  <div></div>

  <div class="body">
    <img class="icon" id="icon" alt="" hidden>
    <div>
      <h1 id="title">Penston Studio</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <div class="foot">
    <span id="foot-left">Penston Studio</span>
    <span class="url" id="foot-right">penston.studio</span>
  </div>

  <script>
    // Populated by scripts/generate-og-cards.mjs via query string.
    const q = new URLSearchParams(location.search);
    const set = (id, value) => { if (value) document.getElementById(id).textContent = value; };
    set('title', q.get('title'));
    set('sub', q.get('sub'));
    set('foot-left', q.get('foot'));

    const title = document.getElementById('title');
    if (title.textContent.length > 24) title.classList.add('long');

    const icon = q.get('icon');
    if (icon) {
      const el = document.getElementById('icon');
      el.src = icon;
      el.hidden = false;
    }
  </script>
</body>
</html>
